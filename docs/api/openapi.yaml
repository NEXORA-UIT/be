openapi: 3.0.3
info:
  title: Nexora Core API Specification
  version: 1.0.0
  description: 'Production-grade RESTful API contract for **Nexora** (Intelligent Project Management System Integrated with
    AI Agents).


    Built directly upon the Software Requirements Specification (SRS) and the approved Endpoint Matrix, this contract specifies
    all data transfer objects, security policies, Optimistic Concurrency Control (OCC), Human-in-the-Loop constraints, and
    role-based access rules across all 10 functional modules.'
  contact:
    name: Nexora Engineering Team
    email: dev@nexora.local
servers:
- url: http://localhost:3000/api/v1
  description: Local Development Server
tags:
- name: Authentication
  description: Local registration, password login, token refresh, and OAuth flows.
- name: Profile
  description: Authenticated user profile management and credential updates.
- name: Workspaces
  description: Workspace boundaries, organization settings, and archiving.
- name: Members
  description: Workspace and Board membership management and role assignments.
- name: Boards
  description: Project board lifecycle, visual customization, archiving, and deletion.
- name: Lists
  description: Workflow stage columns, status groupings, and position reordering.
- name: Cards
  description: Work item cards, attributes, movement, checklist tasks, and attachments.
- name: Tasks
  description: Checklist sub-tasks within cards.
- name: Planning
  description: Card dependencies, timeline calendar view, and progress dashboards.
- name: Collaboration
  description: Card discussion comments and activity audit logs.
- name: Notifications
  description: In-app notification center for assignments, mentions, and due dates.
- name: Quick Notes
  description: Personal scratchpad notes and direct conversion into board cards.
- name: Knowledge Base
  description: Project document storage, asynchronous Tika ingestion, and semantic RAG retrieval.
- name: AI
  description: Contextual AI assistant, progress summarization, and human-in-the-loop proposals.
- name: GitHub
  description: Optional technical repository connector and webhook event processing.
- name: System Administration
  description: Platform administration, user locks, workspace freezes, AI quotas, kill switch, queues, and audit logs.
paths:
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Request local account registration
      description: Stores a pending registration in Redis for 15 minutes and sends a verification link through Gmail. No user or token is created until the link is verified.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Verification email accepted for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPendingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: Gmail delivery is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-AUTH-01
  /auth/verify-registration:
    post:
      tags:
      - Authentication
      summary: Complete local account registration
      description: Verifies the one-time registration token, creates the user, removes pending Redis data, and returns JWT tokens.
      operationId: verifyRegistration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRegistrationRequest'
      responses:
        '201':
          description: User created and authenticated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      x-scope: PROPOSED
      x-related-use-cases:
      - UC-AUTH-01
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate user credentials
      description: Authenticates user using email and password. Returns JWT access and refresh tokens in the JSON response
        body. Rate limited to 5 attempts per minute per IP.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful, token pair returned in response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-AUTH-02
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh access token
      description: Exchanges a valid 7-day refresh token for a newly issued 15-minute access token.
      operationId: refreshAccessToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scope: PROPOSED
      x-related-use-cases:
      - UC-AUTH-02
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Revoke current session
      operationId: logoutCurrentSession
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout-all:
    post:
      tags:
      - Authentication
      summary: Revoke all user sessions
      operationId: logoutAllSessions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: All sessions revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/forgot-password:
    post:
      tags:
      - Authentication
      summary: Request a password reset
      description: Returns the same success response for known and unknown valid emails. A reset token is delivered by the configured Gmail account.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/reset-password:
    post:
      tags:
      - Authentication
      summary: Reset password with a one-time token
      description: Token expires after 15 minutes and revokes every existing session when used.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/oauth/google:
    post:
      tags:
      - Authentication
      summary: Authenticate with Google OAuth
      description: Completes Google OAuth 2.0 Authorization Code exchange. Resolves an existing OAuthAccount by Google sub.
        On first login, a verified Google email matching an existing user is linked to that user; an unclaimed verified email creates a user.
      operationId: loginWithGoogle
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthExchangeRequest'
      responses:
        '200':
          description: Google authentication successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-AUTH-03
  /auth/oauth/github:
    post:
      tags:
      - Authentication
      summary: Authenticate with GitHub OAuth
      description: Completes GitHub OAuth single sign-on using minimal identity scopes (read:user, user:email). Resolves the
        provider ID; an email already owned by another user requires explicit account linking. Distinct from the Board-level repository connector.
      operationId: loginWithGitHub
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthExchangeRequest'
      responses:
        '200':
          description: GitHub authentication successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-AUTH-04
  /auth/me:
    get:
      tags:
      - Profile
      summary: Get authenticated user profile
      description: Retrieves the identity, email, full name, and avatar of the currently authenticated user.
      operationId: getCurrentUserProfile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Profile data retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-AUTH-05
    patch:
      tags:
      - Profile
      summary: Update user profile
      description: Updates full name and/or avatar image URL. If a new avatar is provided, previous media assets may be cleaned
        up asynchronously.
      operationId: updateCurrentUserProfile
      x-implementation-status: planned-cloudinary
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-AUTH-05
  /auth/change-password:
    post:
      tags:
      - Profile
      summary: Change account password
      description: Validates the current password and hashes the new password using Bcrypt. Available only for local password-based
        accounts.
      operationId: changePassword
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-AUTH-05
  /workspaces:
    post:
      tags:
      - Workspaces
      summary: Create workspace
      description: Initializes a top-level workspace representing an organization or department. Automatically designates
        the authenticated creator as the sole Workspace Owner.
      operationId: createWorkspace
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-WS-08
    get:
      tags:
      - Workspaces
      summary: List user workspaces
      description: Retrieves all active workspaces in which the authenticated user is an active member or owner.
      operationId: listWorkspaces
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of accessible workspaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scope: PROPOSED
      x-related-use-cases:
      - UC-WS-08
  /workspaces/{id}:
    get:
      tags:
      - Workspaces
      summary: Get workspace details
      description: Retrieves detailed information and membership settings for a specific workspace.
      operationId: getWorkspaceById
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
      responses:
        '200':
          description: Workspace details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-scope: PROPOSED
      x-related-use-cases:
      - UC-WS-08
    patch:
      tags:
      - Workspaces
      summary: Update workspace
      description: Updates workspace name, description, or domain category. Requires Workspace Owner role.
      operationId: updateWorkspace
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Workspace updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-WS-08
  /workspaces/{id}/archive:
    patch:
      tags:
      - Workspaces
      summary: Archive workspace
      description: Places the workspace into archived state, setting all nested project boards to read-only mode and halting
        automated AI background jobs.
      operationId: archiveWorkspace
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
      responses:
        '200':
          description: Workspace archived successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-WS-08
  /workspaces/{id}/invitations:
    post:
      tags:
      - Members
      summary: Invite member to workspace
      description: Creates an invitation with a secure token valid for 7 days and enqueues an email dispatch job via BullMQ.
        Requires Workspace Owner role.
      operationId: inviteWorkspaceMember
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
      responses:
        '201':
          description: Invitation generated and email job enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-WS-06
  /workspaces/invitations/{token}/accept:
    post:
      tags:
      - Members
      summary: Accept workspace invitation
      description: Accepts an invitation using the unique 7-day token, granting the authenticated user membership in the workspace.
      operationId: acceptWorkspaceInvitation
      security:
      - bearerAuth: []
      parameters:
      - name: token
        in: path
        required: true
        description: Secure invitation token received via email.
        schema:
          type: string
      responses:
        '200':
          description: Invitation accepted; membership activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-WS-06
  /workspaces/invitations/{id}/resend:
    post:
      tags:
      - Members
      summary: Resend workspace invitation
      description: Invalidates the previous invitation token, issues a fresh 7-day token, and queues a new email delivery.
      operationId: resendWorkspaceInvitation
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Unique UUID of the invitation record.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: New invitation token issued and email queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-WS-06
  /workspaces/{id}/members:
    get:
      tags:
      - Members
      summary: List workspace members
      description: Retrieves the list of active members and their assigned workspace roles.
      operationId: listWorkspaceMembers
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
      responses:
        '200':
          description: List of workspace members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-scope: PROPOSED
      x-related-use-cases:
      - UC-WS-07
  /workspaces/{id}/members/{userId}:
    patch:
      tags:
      - Members
      summary: Update member role
      description: Modifies internal RBAC role of a workspace member (MANAGER or MEMBER). Only the Workspace Owner may perform
        this action.
      operationId: updateWorkspaceMemberRole
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
      - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: Member role updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-WS-07
    delete:
      tags:
      - Members
      summary: Remove member from workspace
      description: Soft-deletes workspace membership and cascades access revocation across all child boards. Prevents removing
        the sole Workspace Owner.
      operationId: removeWorkspaceMember
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
      - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Member removed and board permissions revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-WS-07
  /workspaces/{id}/boards:
    post:
      tags:
      - Boards
      summary: Create project board
      description: Creates an independent project board within the workspace, assigns exactly one Project Manager (PM), and
        automatically generates the default Kanban columns (To Do, In Progress, Done).
      operationId: createBoard
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoardRequest'
      responses:
        '201':
          description: Board created with default Kanban columns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-Board-09
    get:
      tags:
      - Boards
      summary: List boards in workspace
      description: Retrieves active boards in the workspace accessible to the authenticated member.
      operationId: listWorkspaceBoards
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
      - name: includeArchived
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Flag to include archived boards.
      responses:
        '200':
          description: List of accessible boards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-scope: PROPOSED
      x-related-use-cases:
      - UC-Board-09
  /boards/{id}:
    get:
      tags:
      - Boards
      summary: Get board details
      description: Retrieves board metadata, settings, and Project Manager identifier.
      operationId: getBoardById
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BoardIdPath'
      responses:
        '200':
          description: Board details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-scope: PROPOSED
      x-related-use-cases:
      - UC-Board-09
    patch:
      tags:
      - Boards
      summary: Update board metadata
      description: Updates board name, description, background color, or header banner image.
      operationId: updateBoard
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BoardIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoardRequest'
      responses:
        '200':
          description: Board updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-scope: SRS-CORE
      x-related-use-cases:
      - UC-Board-09
    delete:
      tags:
      - Boards
      summary: Permanently delete board
      description: 'Permanently deletes a board and cleans up associated Cloudflare R2 files. Enforces the strict archive-first
        lifecycle rule: rejects deletion with 400 Bad Request (BOARD_NOT_ARCHIVED) if the board is still active. Requires
