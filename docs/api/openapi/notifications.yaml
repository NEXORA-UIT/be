paths:
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications for current user
      operationId: listUserNotifications
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Current user's notifications with page metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPaginatedResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-COL-18]
  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Count unread notifications
      operationId: getUnreadNotificationCount
      security:
        - bearerAuth: []
      responses:
        "200": { description: Unread notification count. }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-COL-18]
  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all current user's notifications as read
      operationId: markAllNotificationsAsRead
      security:
        - bearerAuth: []
      responses:
        "200": { description: Notifications marked as read. }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-COL-18]
  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      operationId: markNotificationAsRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Notification marked as read. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-COL-18]
  /notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Delete notification
      operationId: deleteNotification
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Notification deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-COL-18]
