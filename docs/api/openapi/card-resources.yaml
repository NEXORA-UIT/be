paths:
  /cards/{cardId}/assignments:
    get:
      tags: [Cards]
      summary: Xem người được giao cho Card
      operationId: listCardAssignments
      security:
        - bearerAuth: []
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Danh sách phân công hiện tại của Card.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: "#/components/schemas/CardAssignment" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-Card-12]
    post:
      tags: [Cards]
      summary: Giao Card cho thành viên Board
      operationId: assignCardUser
      security:
        - bearerAuth: []
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
      responses:
        "201": { description: Đã thêm người được giao. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-Card-12]
  /cards/{cardId}/assignments/{userId}:
    delete:
      tags: [Cards]
      summary: Gỡ thành viên khỏi Card
      operationId: unassignCardUser
      security:
        - bearerAuth: []
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Đã gỡ phân công. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-Card-12]
  /boards/{boardId}/labels:
    get:
      tags: [Cards]
      summary: Xem nhãn của Board
      operationId: listBoardLabels
      security:
        - bearerAuth: []
      parameters:
        - { name: boardId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Danh sách nhãn của Board. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-Card-12]
    post:
      tags: [Cards]
      summary: Tạo nhãn cho Board
      operationId: createBoardLabel
      security:
        - bearerAuth: []
      parameters:
        - { name: boardId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: { type: string, maxLength: 100 }
                color: { type: string, maxLength: 32 }
      responses:
        "201": { description: Đã tạo nhãn. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-Card-12]
  /labels/{labelId}:
    patch:
      tags: [Cards]
      summary: Cập nhật nhãn Board
      operationId: updateBoardLabel
      security:
        - bearerAuth: []
      parameters:
        - { name: labelId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 100 }
                color: { type: string, maxLength: 32 }
      responses:
        "200": { description: Đã cập nhật nhãn. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-Card-12]
    delete:
      tags: [Cards]
      summary: Xóa nhãn Board
      operationId: deleteBoardLabel
      security:
        - bearerAuth: []
      parameters:
        - { name: labelId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Đã xóa nhãn và các liên kết với Card. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-Card-12]
  /cards/{cardId}/labels:
    get:
      tags: [Cards]
      summary: Xem nhãn của Card
      operationId: listCardLabels
      security:
        - bearerAuth: []
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Danh sách nhãn gắn với Card. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-Card-12]
    post:
      tags: [Cards]
      summary: Gắn nhãn Board vào Card
      operationId: linkCardLabel
      security:
        - bearerAuth: []
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labelId]
              properties:
                labelId: { type: string, format: uuid }
      responses:
        "201": { description: Đã gắn nhãn. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-Card-12]
  /cards/{cardId}/labels/{labelId}:
    delete:
      tags: [Cards]
      summary: Gỡ nhãn khỏi Card
      operationId: unlinkCardLabel
      security:
        - bearerAuth: []
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: labelId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Đã gỡ nhãn. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-Card-12]
