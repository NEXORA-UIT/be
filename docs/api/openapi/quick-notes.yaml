paths:
  /quick-notes:
    get:
      tags: [Quick Notes]
      summary: Xem QuickNote cá nhân
      operationId: listQuickNotes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Các QuickNote thuộc về người dùng đã xác thực.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickNoteListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-COL-19]
    post:
      tags: [Quick Notes]
      summary: Tạo QuickNote cá nhân
      operationId: createQuickNote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuickNoteRequest"
      responses:
        "201":
          description: Đã lưu QuickNote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickNoteResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-COL-19]
  /quick-notes/{id}:
    get:
      tags: [Quick Notes]
      summary: Xem QuickNote cá nhân
      operationId: getQuickNote
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: QuickNote thuộc về người dùng đã xác thực.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickNoteResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-COL-19]
    patch:
      tags: [Quick Notes]
      summary: Cập nhật QuickNote cá nhân
      operationId: updateQuickNote
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateQuickNoteRequest" }
      responses:
        "200":
          description: Đã cập nhật QuickNote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickNoteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-COL-19]
    delete:
      tags: [Quick Notes]
      summary: Xóa QuickNote cá nhân
      operationId: deleteQuickNote
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Đã xóa QuickNote. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-COL-19]
  /quick-notes/{id}/convert:
    post:
      tags: [Quick Notes]
      summary: Chuyển QuickNote cá nhân thành Card
      description: Tạo Card và đánh dấu QuickNote đã chuyển đổi trong cùng một transaction. Nếu tạo Card thất bại, QuickNote không bị thay đổi.
      operationId: convertQuickNoteToCard
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConvertQuickNoteToCardRequest" }
      responses:
        "201":
          description: Card được tạo từ QuickNote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickNoteConversionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-PLAN-02]
