paths:
  /quick-notes:
    get:
      tags: [Quick Notes]
      summary: List personal QuickNotes
      operationId: listQuickNotes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: QuickNotes owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickNoteListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-COL-19]
    post:
      tags: [Quick Notes]
      summary: Create personal QuickNote
      operationId: createQuickNote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuickNoteRequest"
      responses:
        "201":
          description: QuickNote saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickNoteResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-COL-19]
  /quick-notes/{id}:
    get:
      tags: [Quick Notes]
      summary: Get personal QuickNote
      operationId: getQuickNote
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: QuickNote owned by the authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickNoteResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-COL-19]
    patch:
      tags: [Quick Notes]
      summary: Update personal QuickNote
      operationId: updateQuickNote
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateQuickNoteRequest" }
      responses:
        "200":
          description: QuickNote updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickNoteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-COL-19]
    delete:
      tags: [Quick Notes]
      summary: Delete personal QuickNote
      operationId: deleteQuickNote
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: QuickNote deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-COL-19]
  /quick-notes/{id}/convert:
    post:
      tags: [Quick Notes]
      summary: Convert personal QuickNote to a Card
      description: Creates the Card and marks the QuickNote converted in one transaction. A failed Card creation leaves the QuickNote unchanged.
      operationId: convertQuickNoteToCard
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConvertQuickNoteToCardRequest" }
      responses:
        "201":
          description: Card created from QuickNote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickNoteConversionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-PLAN-02]
