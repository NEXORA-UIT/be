paths:
  /workspaces/{id}/boards:
    post:
      tags:
        - Boards
      summary: Create project board
      description: Creates a Board as the Workspace Owner, optionally assigns an active Workspace member as PM, and creates the default To Do, In Progress, and Done Lists in one transaction. The Owner is the default PM.
      operationId: createBoard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardRequest"
      responses:
        "201":
          description: Board created with default Kanban columns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
    get:
      tags:
        - Boards
      summary: List boards in workspace
      description: Retrieves active Boards. A Workspace Owner sees every Board; other Workspace members see only Boards where they have BoardMembership.
      operationId: listWorkspaceBoards
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Flag to include archived boards.
      responses:
        "200":
          description: List of accessible boards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
  /boards/{id}:
    get:
      tags:
        - Boards
      summary: Get board details
      description: Retrieves Board metadata and its assigned Project Manager. Workspace Owners can access every Board; other users need Board membership.
      operationId: getBoard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      responses:
        "200":
          description: Board details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
    patch:
      tags:
        - Boards
      summary: Update board metadata
      description: Updates board name, description, background color, or header banner image.
      operationId: updateBoard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBoardRequest"
      responses:
        "200":
          description: Board updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
  /boards/{id}/archive:
    patch:
      tags:
        - Boards
      summary: Archive board
      description: Archives the specified board, setting project content to read-only and removing it from the active dashboard view.
      operationId: archiveBoard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      responses:
        "200":
          description: Board archived successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
  /boards/{id}/unarchive:
    patch:
      tags:
        - Boards
      summary: Restore archived board
      description: Restores an archived Board only while its Workspace is active, re-enabling regular editing.
      operationId: restoreBoard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      responses:
        "200":
          description: Board restored to active status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
  /boards/{id}/pm:
    patch:
      tags:
        - Boards
      summary: Assign or change board PM
      description: Only the Workspace Owner may transfer this Board's PM role to an active Workspace member. The transfer is atomic and records appointedBy.
      operationId: assignBoardPm
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignBoardPmRequest"
      responses:
        "200":
          description: Board PM reassigned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
  /boards/{id}/members:
    get:
      tags:
        - Boards
      summary: List board members
      description: Retrieves the list of members explicitly assigned to participate in this project board.
      operationId: listBoardMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      responses:
        "200":
          description: List of board members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardMemberListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
    post:
      tags:
        - Boards
      summary: Add member to board
      description: Adds an active workspace member to this specific project board. Member must already belong to the parent workspace.
      operationId: addBoardMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBoardMemberRequest"
      responses:
        "201":
          description: Member added to board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardMemberResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
  /boards/{id}/members/{userId}:
    delete:
      tags:
        - Boards
      summary: Remove member from board
      description: Revokes Board access and removes the target user's assignments from all Cards in the Board.
      operationId: removeBoardMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: Member removed from board and assignments cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
  /boards/{id}/lists:
    post:
      tags:
        - Lists
      summary: Create Kanban list column
      description: Creates a workflow List with an explicit statusGroup. A Board may have at most 30 active Lists.
      operationId: createList
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListRequest"
      responses:
        "201":
          description: List created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-List-10
    get:
      tags:
        - Lists
      summary: List board columns
      description: Retrieves active Lists for the Board in position order.
      operationId: listBoardLists
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Lists in position order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-List-10
  /lists/{id}:
    patch:
      tags:
        - Lists
      summary: Update list column
      description: Updates the title or status category grouping of a list.
      operationId: updateList
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListRequest"
      responses:
        "200":
          description: List updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-List-10
  /lists/{id}/position:
    patch:
      tags:
        - Lists
      summary: Reorder list position
      description: Updates List position transactionally. Conflicting positions are re-indexed deterministically; clients refresh through the REST API.
      operationId: reorderList
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderListRequest"
      responses:
        "200":
          description: List position updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-List-10
  /lists/{id}/archive:
    patch:
      tags:
        - Lists
      summary: Archive list column
      description: Archives the List. If it contains active Cards, provide a destination List or set archiveCards to true.
      operationId: archiveList
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveListRequest"
      responses:
        "200":
          description: List archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-List-10
  /lists/{id}/restore:
    patch:
      tags:
        - Lists
      summary: Restore an archived List
      description: Restores a List only while its Board and Workspace are active. Archived Cards remain archived.
      operationId: restoreList
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListIdPath"
      responses:
        "200":
          description: List restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-List-10
