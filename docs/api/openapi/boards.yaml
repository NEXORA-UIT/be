paths:
  /workspaces/{id}/boards:
    post:
      tags:
        - Boards
      summary: Tạo Board dự án
      description: Tạo Board với tư cách Workspace Owner, có thể chỉ định thành viên đang hoạt động trong Workspace làm PM, đồng thời tạo ba List mặc định To Do, In Progress và Done trong cùng một transaction. Owner là PM mặc định.
      operationId: createBoard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardRequest"
      responses:
        "201":
          description: Đã tạo Board cùng các cột Kanban mặc định.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
    get:
      tags:
        - Boards
      summary: Lấy danh sách Board trong Workspace
      description: Trả về các Board đang hoạt động. Workspace Owner xem được mọi Board; thành viên Workspace khác chỉ xem Board mà họ có BoardMembership.
      operationId: listWorkspaceBoards
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Cờ cho biết có bao gồm Board đã lưu trữ hay không.
      responses:
        "200":
          description: Danh sách Board người dùng có thể truy cập.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
  /boards/{id}:
    get:
      tags:
        - Boards
      summary: Lấy thông tin Board
      description: Trả về metadata và Project Manager được phân công cho Board. Workspace Owner truy cập được mọi Board; người dùng khác cần có membership của Board.
      operationId: getBoard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      responses:
        "200":
          description: Chi tiết Board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
    patch:
      tags:
        - Boards
      summary: Cập nhật thông tin Board
      description: Cập nhật tên, mô tả, màu nền hoặc ảnh bìa của Board.
      operationId: updateBoard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBoardRequest"
      responses:
        "200":
          description: Đã cập nhật Board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
    delete:
      tags:
        - Boards
      summary: Xóa vĩnh viễn Board đã lưu trữ
      description: Chỉ Workspace Owner được xóa Board đã lưu trữ sau khi xác nhận chính xác tên Board. Các object Attachment được dọn trước khi xóa dữ liệu quan hệ; nếu cleanup thất bại, dữ liệu trong database được giữ lại để thử lại.
      operationId: deleteArchivedBoard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmDeleteBoardRequest"
      responses:
        "200":
          description: Đã xóa Board và dữ liệu quan hệ của Board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-Board-09]
  /boards/{id}/archive:
    patch:
      tags:
        - Boards
      summary: Lưu trữ Board
      description: Lưu trữ Board, chuyển nội dung dự án sang chỉ đọc và ẩn Board khỏi trang tổng quan đang hoạt động.
      operationId: archiveBoard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      responses:
        "200":
          description: Đã lưu trữ Board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
  /boards/{id}/unarchive:
    patch:
      tags:
        - Boards
      summary: Khôi phục Board đã lưu trữ
      description: Chỉ khôi phục Board đã lưu trữ khi Workspace đang hoạt động; sau đó có thể chỉnh sửa như bình thường.
      operationId: restoreBoard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      responses:
        "200":
          description: Đã khôi phục Board về trạng thái hoạt động.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
  /boards/{id}/pm:
    patch:
      tags:
        - Boards
      summary: Phân công hoặc đổi PM của Board
      description: Chỉ Workspace Owner được chuyển vai trò PM của Board cho thành viên Workspace đang hoạt động. Thao tác được thực hiện nguyên tử, ghi ActivityLog BOARD_PM_TRANSFERRED và lưu thông tin người bổ nhiệm trong `appointedBy` với appointmentProvenance RECORDED.
      operationId: assignBoardPm
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignBoardPmRequest"
      responses:
        "200":
          description: Đã chuyển quyền PM của Board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
  /boards/{id}/members:
    get:
      tags:
        - Boards
      summary: Lấy danh sách thành viên Board
      description: Trả về các thành viên được thêm rõ ràng vào Board dự án này.
      operationId: listBoardMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      responses:
        "200":
          description: Danh sách thành viên Board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardMemberListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
    post:
      tags:
        - Boards
      summary: Thêm thành viên vào Board
      description: Thêm một thành viên Workspace đang hoạt động vào Board này. Người đó phải là thành viên của Workspace cha.
      operationId: addBoardMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBoardMemberRequest"
      responses:
        "201":
          description: Đã thêm thành viên vào Board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardMemberResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
  /boards/{id}/members/{userId}:
    delete:
      tags:
        - Boards
      summary: Xóa thành viên khỏi Board
      description: Thu hồi quyền truy cập Board và gỡ các assignment của người dùng đó khỏi toàn bộ Card trong Board.
      operationId: removeBoardMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: Đã xóa thành viên khỏi Board và gỡ các phân công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Board-09
  /boards/{id}/lists:
    post:
      tags:
        - Lists
      summary: Tạo List cho quy trình Kanban
      description: Tạo List với `statusGroup` được chỉ định rõ. Mỗi Board có tối đa 30 List đang hoạt động.
      operationId: createList
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListRequest"
      responses:
        "201":
          description: Đã tạo List.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-List-10
    get:
      tags:
        - Lists
      summary: Lấy danh sách List của Board
      description: Trả về các List đang hoạt động của Board theo thứ tự vị trí.
      operationId: listBoardLists
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Các List theo thứ tự vị trí.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-List-10
  /lists/{id}:
    patch:
      tags:
        - Lists
      summary: Cập nhật List
      description: Cập nhật tên hoặc nhóm trạng thái của List.
      operationId: updateList
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListRequest"
      responses:
        "200":
          description: Đã cập nhật List.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-List-10
  /lists/{id}/position:
    patch:
      tags:
        - Lists
      summary: Sắp xếp lại vị trí List
      description: Cập nhật vị trí List trong transaction. Nếu vị trí xung đột, hệ thống đánh lại chỉ mục theo thứ tự xác định; client tải trạng thái mới qua REST API.
      operationId: reorderList
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderListRequest"
      responses:
        "200":
          description: Đã cập nhật vị trí List.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-List-10
  /lists/{id}/archive:
    patch:
      tags:
        - Lists
      summary: Lưu trữ List
      description: Lưu trữ List. Nếu List còn Card đang hoạt động, hãy chỉ định List đích hoặc đặt `archiveCards` thành `true`.
      operationId: archiveList
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveListRequest"
      responses:
        "200":
          description: Đã lưu trữ List.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-List-10
  /lists/{id}/restore:
    patch:
      tags:
        - Lists
      summary: Khôi phục List đã lưu trữ
      description: Chỉ khôi phục List khi Board và Workspace đang hoạt động. Các Card đã lưu trữ vẫn giữ trạng thái lưu trữ.
      operationId: restoreList
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListIdPath"
      responses:
        "200":
          description: Đã khôi phục List.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-List-10
