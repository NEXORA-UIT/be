components:
  schemas:
    AIChatMessageRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Những công việc nào đang bị trễ hạn và ai đang phụ trách?
        conversationId:
          type: string
          format: uuid
          description: Optional conversation session identifier.
    AIProposal:
      type: object
      required:
        - id
        - boardId
        - actionType
        - targetCardId
        - proposedChanges
        - reason
        - status
        - expiresAt
        - createdAt
      description: Action Card proposal generated by AI requiring Project Manager approval (Human-in-the-Loop).
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        actionType:
          type: string
          enum:
            - RESCHEDULE_CARD
            - REASSIGN_CARD
            - CREATE_CARD
            - MOVE_CARD
          example: RESCHEDULE_CARD
        targetCardId:
          type: string
          format: uuid
          nullable: true
        proposedChanges:
          type: object
          example:
            dueDate: 2026-10-15T17:00:00.000Z
        reason:
          type: string
          example: Phụ thuộc vào thẻ 'Setup DB' bị dời lịch 3 ngày.
        status:
          type: string
          enum:
            - PENDING
            - APPROVED
            - REJECTED
            - EXPIRED
          example: PENDING
        expiresAt:
          type: string
          format: date-time
          description: Action card expiration (24h TTL).
        createdAt:
          type: string
          format: date-time
    AIChatResult:
      type: object
      required:
        - conversationId
        - reply
      description: AI conversation reply with citations and optional action proposals.
      properties:
        conversationId:
          type: string
          format: uuid
        reply:
          type: string
          example: Hiện có 2 thẻ việc đang bị quá hạn...
        citations:
          type: array
          items:
            $ref: "#/components/schemas/RAGCitation"
        proposedActions:
          type: array
          items:
            $ref: "#/components/schemas/AIProposal"
    AISummarizeProgressRequest:
      type: object
      properties:
        focus:
          type: string
          example: Sprint 1 bottlenecks and overdue milestones
    AISummarizeProgressResult:
      type: object
      required:
        - summary
        - overdueHighlights
        - bottleneckAnalysis
        - recommendations
      description: Executive progress summary generated by the AI Agent.
      properties:
        summary:
          type: string
          example: Tổng quan tiến độ đạt 42% hoàn thành.
        overdueHighlights:
          type: array
          items:
            type: string
        bottleneckAnalysis:
          type: string
        recommendations:
          type: array
          items:
            type: string
    AIKillSwitchStatus:
      type: object
      required:
        - isAiDisabled
      description: State of the platform-wide AI emergency kill switch.
      properties:
        isAiDisabled:
          type: boolean
          example: false
        reason:
          type: string
          nullable: true
        disabledAt:
          type: string
          format: date-time
          nullable: true
        disabledBy:
          type: string
          format: uuid
          nullable: true
    AIChatResponse:
      type: object
      required:
        - success
        - data
      description: Standard response envelope containing AI chat reply, citations, and proposals.
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/AIChatResult"
    AIChatResponseWrapper:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/AIChatResult"
    AISummarizeProgressResponse:
      type: object
      required:
        - success
        - data
      description: Standard response envelope containing executive AI progress summary report.
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/AISummarizeProgressResult"
    AISummarizeProgressResponseWrapper:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/AISummarizeProgressResult"
    AIProposalListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/AIProposal"
    AIKillSwitchStatusResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/AIKillSwitchStatus"
