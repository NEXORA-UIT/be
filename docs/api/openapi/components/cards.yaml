components:
  schemas:
    Task:
      type: object
      required:
        - id
        - cardId
        - title
        - isCompleted
        - position
        - createdAt
        - updatedAt
      description: Atomic checklist sub-task within a card.
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
        title:
          type: string
          example: Implement unit tests for auth service
        isCompleted:
          type: boolean
          example: false
        position:
          type: number
          example: 1024
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: Write OpenAPI specification
    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
        isCompleted:
          type: boolean
    CardAttachment:
      type: object
      required:
        - id
        - cardId
        - fileName
        - fileUrl
        - fileSize
        - uploadedBy
        - createdAt
      description: Binary attachment file linked to a card.
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
        fileName:
          type: string
          example: architecture_diagram.png
        fileUrl:
          type: string
          format: uri
        fileSize:
          type: integer
          description: File size in bytes.
          example: 1048576
        uploadedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    Card:
      type: object
      required:
        - id
        - listId
        - boardId
        - title
        - priority
        - position
        - status
        - assigneeIds
        - labelIds
        - tasksCount
        - completedTasksCount
        - updatedAt
        - createdAt
      description: Central work item card.
      properties:
        id:
          type: string
          format: uuid
        listId:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        title:
          type: string
          example: Design Authentication Service
        description:
          type: string
          nullable: true
          description: Markdown-formatted text description.
        startDate:
          type: string
          format: date-time
          nullable: true
        dueDate:
          type: string
          format: date-time
          nullable: true
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - URGENT
          example: HIGH
        position:
          type: number
          example: 1024
        status:
          type: string
          enum:
            - ACTIVE
            - ARCHIVED
          example: ACTIVE
        assigneeIds:
          type: array
          items:
            type: string
            format: uuid
        labelIds:
          type: array
          items:
            type: string
            format: uuid
        tasksCount:
          type: integer
          example: 4
        completedTasksCount:
          type: integer
          example: 2
        updatedAt:
          type: string
          format: date-time
          description: Optimistic Concurrency Control (OCC) timestamp.
        createdAt:
          type: string
          format: date-time
    CardDetail:
      allOf:
        - $ref: "#/components/schemas/Card"
        - type: object
          properties:
            tasks:
              type: array
              items:
                $ref: "#/components/schemas/Task"
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/CardAttachment"
            assignees:
              type: array
              items:
                $ref: "#/components/schemas/UserSummary"
            labels:
              type: array
              items:
                $ref: "#/components/schemas/BoardLabel"
    CreateCardRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: Setup Docker development environment
        description:
          type: string
        startDate:
          type: string
          format: date-time
        dueDate:
          type: string
          format: date-time
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - URGENT
          default: MEDIUM
        assigneeIds:
          type: array
          items:
            type: string
            format: uuid
        labelIds:
          type: array
          items:
            type: string
            format: uuid
    UpdateCardRequest:
      type: object
      required:
        - updatedAt
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
          nullable: true
        dueDate:
          type: string
          format: date-time
          nullable: true
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - URGENT
        assigneeIds:
          type: array
          items:
            type: string
            format: uuid
        labelIds:
          type: array
          items:
            type: string
            format: uuid
        updatedAt:
          type: string
          format: date-time
          description: Required OCC timestamp matching the server value. If stale, server returns 409 CARD_CONFLICT.
    MoveCardRequest:
      type: object
      required:
        - targetListId
        - position
        - updatedAt
      properties:
        targetListId:
          type: string
          format: uuid
          description: Target List UUID.
        position:
          type: number
          description: Calculated position coordinate inside target list.
        updatedAt:
          type: string
          format: date-time
          description: Required OCC timestamp for concurrency check.
    CardDependency:
      type: object
      required:
        - id
        - cardId
        - dependsOnCardId
        - createdAt
      description: Prerequisite dependency constraint between two cards.
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
          description: Card that depends on prerequisite.
        dependsOnCardId:
          type: string
          format: uuid
          description: Prerequisite Card that must be completed first.
        createdAt:
          type: string
          format: date-time
    CardResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Card"
    CardDetailResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/CardDetail"
    CardListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Card"
    TaskResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Task"
    CardAttachmentResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/CardAttachment"
    CardDependencyResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/CardDependency"
