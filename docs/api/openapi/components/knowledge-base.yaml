components:
  schemas:
    KnowledgeBaseDocument:
      type: object
      required:
        - id
        - boardId
        - fileName
        - fileUrl
        - fileSize
        - status
        - uploadedBy
        - createdAt
        - updatedAt
      description: Knowledge Base document record.
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        fileName:
          type: string
          example: Software_Architecture_Doc.pdf
        fileUrl:
          type: string
          format: uri
        fileSize:
          type: integer
          example: 2048500
        status:
          type: string
          enum:
            - PENDING
            - PROCESSING
            - READY
            - FAILED
          example: READY
        uploadedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RAGQueryRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '\S'
          example: Tiêu chuẩn nén tệp đính kèm được quy định thế nào trong tài liệu?
    RAGCitation:
      type: object
      additionalProperties: false
      required:
        - documentId
        - documentName
        - chunkId
        - snippet
      description: Source citation grounding an AI response.
      properties:
        documentId:
          type: string
          format: uuid
        documentName:
          type: string
          minLength: 1
          pattern: '\S'
          example: Tài liệu SRS Đồ án 1.pdf
        chunkId:
          type: string
          format: uuid
        pageNumber:
          type: integer
          minimum: 1
          nullable: true
          description: Optional for TXT/DOCX sources without page numbers.
          example: 57
        sourceLocator:
          type: string
          nullable: true
          description: Stable paragraph/section locator for sources without pages.
        snippet:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '\S'
          example: Dung lượng tệp đính kèm tối đa là 25MB...
    RAGAnswer:
      type: object
      required:
        - answer
        - citations
      description: Grounded answer synthesized with source citations.
      properties:
        answer:
          type: string
          example: Theo tài liệu SRS trang 57, tệp đính kèm có dung lượng tối đa 25MB.
        citations:
          type: array
          items:
            $ref: "#/components/schemas/RAGCitation"
    RAGAnswerDeltaEvent:
      type: object
      additionalProperties: false
      required: [schemaVersion, correlationId, delta]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        correlationId:
          type: string
          format: uuid
        delta:
          type: string
          minLength: 1
    RAGCitationEvent:
      type: object
      additionalProperties: false
      required: [schemaVersion, correlationId, citation]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        correlationId:
          type: string
          format: uuid
        citation:
          $ref: "#/components/schemas/RAGCitation"
    RAGAnswerDoneEvent:
      type: object
      additionalProperties: false
      required: [schemaVersion, correlationId, answer, citations]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        correlationId:
          type: string
          format: uuid
        answer:
          type: string
          minLength: 1
          pattern: '\S'
        citations:
          type: array
          items:
            $ref: "#/components/schemas/RAGCitation"
    RAGErrorEvent:
      type: object
      additionalProperties: false
      required: [schemaVersion, correlationId, code, message, retryable]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        correlationId:
          type: string
          format: uuid
        code:
          type: string
          enum: [RAG_QUERY_FAILED, MODEL_UNAVAILABLE, REQUEST_TIMEOUT]
        message:
          type: string
          minLength: 1
          pattern: '\S'
          description: Sanitized client-safe error; never an exception or stack trace.
        retryable:
          type: boolean
    KnowledgeBaseDocumentResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/KnowledgeBaseDocument"
    KnowledgeBaseDocumentListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeBaseDocument"
    RAGAnswerResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/RAGAnswer"
