components:
  schemas:
    QuickNote:
      type: object
      required:
        - id
        - userId
        - content
        - convertedAt
        - convertedCardId
        - createdAt
        - updatedAt
      description: Personal scratchpad note independent of project boards.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        content:
          type: string
          example: Cần tích hợp Apache Tika trong docker compose
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        convertedAt:
          type: string
          format: date-time
          nullable: true
        convertedCardId:
          type: string
          format: uuid
          nullable: true
    CreateQuickNoteRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          example: "Ý tưởng: bổ sung thanh tiến độ checklist"
    UpdateQuickNoteRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
    ConvertQuickNoteToCardRequest:
      type: object
      required:
        - boardId
        - listId
      description: Parameters to convert a personal quick note into a board card.
      properties:
        boardId:
          type: string
          format: uuid
          description: Target board UUID.
        listId:
          type: string
          format: uuid
          description: Target list UUID within board.
    QuickNoteResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/QuickNote"
    QuickNoteListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/QuickNote"
    QuickNoteConversionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [note, card]
          properties:
            note: { $ref: "#/components/schemas/QuickNote" }
            card: { $ref: "#/components/schemas/Card" }
