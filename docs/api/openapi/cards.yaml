paths:
  /lists/{listId}/cards:
    post:
      tags:
        - Cards
      summary: Create work item card
      description: Creates a Card in an active List on an accessible Board, assigns a Board-unique cardKey, and records CARD_CREATED in ActivityLog in the same transaction. Enforces a 2,000 non-deleted Card limit per Board.
      operationId: createCard
      security:
        - bearerAuth: []
      parameters:
        - name: listId
          in: path
          required: true
          description: Unique UUID of the destination List.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardRequest"
      responses:
        "201":
          description: Card created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Card-12
  /cards/{id}:
    get:
      tags:
        - Cards
      summary: Get card details
      description: Retrieves Card Core fields, the status group derived from its List, and its archive timestamp. Archived Cards remain readable; soft-deleted Cards do not.
      operationId: getCardById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
      responses:
        "200":
          description: Card Core fields with derived status group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Card-12
    patch:
      tags:
        - Cards
      summary: Update card details
      description: "Updates card properties. Enforces Optimistic Concurrency Control (OCC): the client must supply its current `updatedAt` value. If outdated, the server rejects with 409 Conflict (CARD_CONFLICT). Enforces startDate <= dueDate."
      operationId: updateCard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardRequest"
      responses:
        "200":
          description: Card updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Card-12
    delete:
      tags:
        - Cards
      summary: Delete card
      description: Soft-deletes the Card while retaining comments and activity history.
      operationId: deleteCard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
      responses:
        "200":
          description: Card deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Card-12
  /cards/{id}/move:
    patch:
      tags:
        - Cards
      summary: Move card position or list
      description: "Moves or reorders a Card within the same active Board. Status is derived from the destination List. Enforces OCC via `updatedAt`; dependency guards are added by the REST completion branch."
      operationId: moveCard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveCardRequest"
      responses:
        "200":
          description: Card moved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Card-12
  /cards/{id}/archive:
    patch:
      tags:
        - Cards
      summary: Archive card
      description: Removes the card from active board display while keeping historical comments, activity logs, and attachments intact.
      operationId: archiveCard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
      responses:
        "200":
          description: Card archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Card-12
  /cards/{id}/restore:
    patch:
      tags:
        - Cards
      summary: Restore archived Card
      description: Restores an archived Card when its Workspace, Board, and List parents are active.
      operationId: restoreCard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
      responses:
        "200":
          description: Card restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Card-12
  /boards/{boardId}/cards:
    get:
      tags:
        - Cards
      summary: List Cards on a Board
      description: Returns active Cards in List and Card order. Set includeArchived=true to include archived Cards. UC-Card-13 filtering is performed client-side on the loaded Board data.
      operationId: listBoardCards
      security:
        - bearerAuth: []
      parameters:
        - name: boardId
          in: path
          required: true
          description: Unique UUID of the Board.
          schema:
            type: string
            format: uuid
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Cards ordered by List and position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Card-12
        - UC-Card-13
  /cards/{id}/tasks:
    get:
      tags:
        - Tasks
      summary: List checklist tasks
      description: Lists the checklist items for a Card in their stored order.
      operationId: listCardTasks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
      responses:
        "200":
          description: Checklist items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-Card-12
    post:
      tags:
        - Tasks
      summary: Add checklist task to card
      description: Adds an atomic checklist sub-task to the card. Enforces a hard limit of max 50 checklist tasks per card.
      operationId: createCardTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-implementation-status: IMPLEMENTED
      x-related-use-cases:
        - UC-Card-12
  /tasks/{id}:
    patch:
      tags:
        - Tasks
      summary: Update checklist task
      description: Updates task title or completion status. Completing tasks automatically recalculates card progress without moving the card to Done.
      operationId: updateTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Task updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-implementation-status: IMPLEMENTED
      x-related-use-cases:
        - UC-Card-12
    delete:
      tags:
        - Tasks
      summary: Delete checklist task
      description: Removes a checklist item from the card.
      operationId: deleteTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskIdPath"
      responses:
        "200":
          description: Task removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-implementation-status: IMPLEMENTED
      x-related-use-cases:
        - UC-Card-12
  /cards/{id}/attachments:
    get:
      tags:
        - Cards
      summary: List card attachments
      operationId: listCardAttachments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
      responses:
        "200":
          description: Card attachment metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardAttachmentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-implementation-status: IMPLEMENTED
      x-related-use-cases:
        - UC-COL-17
    post:
      tags:
        - Cards
      summary: Upload card attachment
      description: Uploads a binary work file associated with the Card using the configured object-storage adapter. Enforces a 25 MiB limit and validates MIME signature. Attachments remain separate from Knowledge Base documents.
      operationId: uploadCardAttachment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          text/plain:
            schema:
              type: string
              format: binary
          application/vnd.openxmlformats-officedocument.wordprocessingml.document:
            schema:
              type: string
              format: binary
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
        - name: X-File-Name
          in: header
          required: true
          schema:
            type: string
          description: Original file name, with extension matching the detected MIME type.
      responses:
        "201":
          description: Attachment uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardAttachmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
      x-scope: SRS-CORE
      x-implementation-status: IMPLEMENTED
      x-related-use-cases:
        - UC-COL-17
  /attachments/{attachmentId}/content:
    get:
      tags:
        - Cards
      summary: Download card attachment
      operationId: downloadCardAttachment
      security:
        - bearerAuth: []
      parameters:
        - name: attachmentId
          in: path
          required: true
          description: Attachment UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Attachment bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-implementation-status: IMPLEMENTED
      x-related-use-cases:
        - UC-COL-17
  /attachments/{attachmentId}:
    delete:
      tags:
        - Cards
      summary: Delete card attachment
      description: Removes the attachment record and stored object. If object cleanup fails, metadata is retained so cleanup can be retried.
      operationId: deleteCardAttachment
      security:
        - bearerAuth: []
      parameters:
        - name: attachmentId
          in: path
          required: true
          description: Attachment UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Attachment deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-implementation-status: IMPLEMENTED
      x-related-use-cases:
        - UC-Card-12
