paths:
  /cards/{id}/dependencies:
    get:
      tags: [Planning]
      summary: List Card prerequisites
      operationId: listCardDependencies
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
      responses:
        "200":
          description: Prerequisite Cards for this Card.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      prerequisites:
                        type: array
                        items: { $ref: "#/components/schemas/CardDependencySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-PLAN-03]
    post:
      tags:
        - Planning
      summary: Declare card dependency
      description: Establishes a prerequisite relationship where card `{id}` cannot be moved to DONE until `dependsOnCardId` is completed. Rejects circular dependencies.
      operationId: createCardDependency
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDependencyRequest"
      responses:
        "201":
          description: Dependency created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDependencyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-PLAN-03
  /cards/{id}/dependencies/{dependencyId}:
    delete:
      tags:
        - Planning
      summary: Remove card dependency
      description: Removes a prerequisite relationship between two cards.
      operationId: deleteCardDependency
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
        - name: dependencyId
          in: path
          required: true
          description: Unique UUID of the dependency record.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dependency removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-PLAN-03
  /boards/{id}/calendar:
    get:
      tags:
        - Planning
      summary: Get board calendar schedule
      description: Retrieves cards with start and due dates formatted for display in FullCalendar views.
      operationId: getBoardCalendar
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Interval start in UTC.
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Interval end in UTC.
      responses:
        "200":
          description: Cards scheduled within the date window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-PLAN-01
  /boards/{id}/dashboard:
    get:
      tags:
        - Planning
      summary: Get board progress dashboard (Supporting Proposed API)
      description: Returns Card counts by List status group and overdue count for an authorized Board. Status is derived from the List; an empty Board returns zero counts.
      operationId: getBoardDashboard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      responses:
        "200":
          description: Progress statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDashboardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-scope: SRS-CORE
      x-related-use-cases:
        - UC-PLAN-04
  /boards/{id}/list-view:
    get:
      tags: [Planning]
      summary: Get Board Lists and Cards
      operationId: getBoardListView
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
      responses:
        "200": { description: Active Lists with their active Cards. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-scope: SRS-CORE
      x-related-use-cases: [UC-PLAN-01]
